<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5efe4" />
    <meta name="description" content="HelloMajor hub: explore Iowa State majors, learning communities, alumni experiences and advising prep with transparent, explainable recommendations." />
    <title>HelloMajor — Major &amp; Learning-Community Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Set the theme before first paint so dark mode never flashes light. -->
    <script>
      try {
        var t = localStorage.getItem('fitfinder.theme-v2') || 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
